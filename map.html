<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIDUX | Smart Map</title>
    
    <!-- A-Frame & AR.js для 3D/AR -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <!-- MapLibre GL -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        :root { --main-green: #2e7d32; --neon-green: #a5ffb1; }
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', sans-serif; color: white; }
        
        /* Навигация */
        .nav {
            position: fixed; top: 0; width: 100%; height: 60px;
            z-index: 4000; background: rgba(0,0,0,0.85);
            display: flex; align-items: center; justify-content: space-around;
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--main-green);
        }
        .nav a { color: white; text-decoration: none; font-size: 14px; font-weight: bold; text-transform: uppercase; transition: 0.2s; }
        .nav a:hover { transform: scale(1.05); color: var(--neon-green); }
        .nav a.active { color: var(--neon-green); border-bottom: 2px solid var(--neon-green); }
        
        /* Панель управления */
        #smart-panel {
            position: fixed; top: 75px; left: 50%; transform: translateX(-50%);
            z-index: 3000; width: 92%; max-width: 450px;
            padding: 15px; border-radius: 15px; background: rgba(0,0,0,0.8);
            border: 1px solid var(--main-green); box-sizing: border-box;
        }
        .search-row { display: flex; gap: 8px; margin-top: 10px; position: relative; }
        input {
            flex: 1; height: 45px; background: #111; border: 1px solid var(--main-green);
            color: white; border-radius: 8px; padding: 0 10px; font-size: 16px;
        }
        .icon-btn {
            width: 45px; height: 45px; background: var(--main-green); border: none;
            border-radius: 8px; cursor: pointer; transition: transform 0.2s, background 0.3s;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .icon-btn:hover { transform: scale(1.05); background: #1b5e20; }
        .recording { background: #ff5252 !important; box-shadow: 0 0 15px #ff5252; animation: pulse 1.5s infinite; }
        .searching { animation: pulse 0.8s infinite; background: #ff9800 !important; }
        
        /* Автокомплит */
        .autocomplete-items {
            position: absolute; top: 100%; left: 0; right: 0; background: #222;
            border: 1px solid var(--main-green); border-top: none; border-radius: 0 0 8px 8px;
            z-index: 3100; max-height: 200px; overflow-y: auto;
        }
        .autocomplete-items div {
            padding: 10px; cursor: pointer; color: white; border-bottom: 1px solid #333;
        }
        .autocomplete-items div:hover { background: var(--main-green); }
        
        /* ИИ-помощник */
        #ai-assistant {
            position: fixed; bottom: 20px; right: 20px; z-index: 5000;
            width: 60px; height: 60px; background: var(--main-green);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 0 20px rgba(46, 125, 50, 0.5); font-size: 28px;
            transition: transform 0.2s;
        }
        #ai-assistant:hover { transform: scale(1.05); }
        
        /* AR-сцена (скрыта по умолчанию) */
        .ar-scene {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 7000; display: none; background: black;
        }
        .close-ar {
            position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7);
            color: white; border: none; font-size: 30px; cursor: pointer; border-radius: 50%;
            width: 50px; height: 50px; z-index: 7100;
        }
        #map-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; }
        
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.02); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        .https-warning {
            position: fixed; bottom: 20px; left: 20px; z-index: 6000;
            background: rgba(255,82,82,0.9); color: white; padding: 8px 15px;
            border-radius: 20px; font-size: 12px; pointer-events: none;
        }
    </style>
</head>
<body>
    <header class="nav">
        <a href="index.html">Главная</a>
        <a href="about.html">О проекте</a>
        <a href="map.html" class="active">Карта</a>
        <a href="contact.html">Связь</a>
    </header>
    
    <div id="smart-panel">
        <div style="display: flex; gap: 10px;">
            <button id="btn-map" class="icon-btn" style="flex:1">🗺️</button>
            <button id="btn-ar" class="icon-btn" style="flex:1">📷</button>
        </div>
        <div class="search-row">
            <input type="text" id="target-input" placeholder="Куда идем? (напр. мечеть, акимат)" autocomplete="off">
            <button id="mic-btn" class="icon-btn">🎤</button>
            <button id="go-btn" class="icon-btn">🚀</button>
        </div>
    </div>
    
    <div id="ai-assistant">🤖</div>
    <div id="map-container"><div id="map" style="width: 100%; height: 100%;"></div></div>
    
    <!-- AR-сцена с моделью doomr.glb -->
    <div id="arScene" class="ar-scene">
        <button class="close-ar" id="closeArBtn">✖</button>
        <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
            <a-marker preset="hiro">
                <a-entity gltf-model="url(doomr.glb)" scale="0.05 0.05 0.05" position="0 0 0"></a-entity>
            </a-marker>
            <a-entity camera></a-entity>
        </a-scene>
    </div>
    
    <script>
        // --- ПРОВЕРКА HTTPS ---
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            if (confirm("Для работы камеры и микрофона требуется HTTPS. Перейти на HTTPS?")) {
                location.protocol = 'https:';
            } else {
                const warn = document.createElement('div');
                warn.className = 'https-warning';
                warn.textContent = '⚠️ Некоторые функции могут не работать без HTTPS';
                document.body.appendChild(warn);
            }
        }
        
        // --- БАЗА ДАННЫХ МЕСТ (трёхъязычная) ---
        const locations = [
            { lat: 53.74723007127184, lng: 62.06331027656053, aliases: ["акимат", "akimat", "әкімат"] },
            { lat: 53.746552406628794, lng: 62.061850574674715, aliases: ["дюсш", "dyussh", "дюсш"] },
            { lat: 53.74672529532632, lng: 62.062435293253195, aliases: ["дом культуры", "house of culture", "мәдениет үйі"] },
            { lat: 53.74978812601662, lng: 62.053696745170924, aliases: ["мечеть", "mosque", "мешіт"] },
            { lat: 53.74811054892305, lng: 62.05363895876727, aliases: ["школа №1", "school 1", "мектеп №1"] },
            { lat: 53.749254494869646, lng: 62.07068433901487, aliases: ["школа №2", "school 2", "мектеп №2"] }
        ];
        
        // --- ФУНКЦИЯ АВТОКОРРЕКЦИИ (расстояние Левенштейна) ---
        function levenshtein(a, b) {
            const matrix = Array(b.length + 1).fill(null).map(() => Array(a.length + 1).fill(null));
            for (let i = 0; i <= a.length; i++) matrix[0][i] = i;
            for (let j = 0; j <= b.length; j++) matrix[j][0] = j;
            for (let j = 1; j <= b.length; j++) {
                for (let i = 1; i <= a.length; i++) {
                    const cost = a[i-1] === b[j-1] ? 0 : 1;
                    matrix[j][i] = Math.min(
                        matrix[j][i-1] + 1,
                        matrix[j-1][i] + 1,
                        matrix[j-1][i-1] + cost
                    );
                }
            }
            return matrix[b.length][a.length];
        }
        
        function suggestLocation(query) {
            if (!query) return null;
            const normalizedQuery = query.toLowerCase().trim();
            let bestMatch = null;
            let bestScore = Infinity;
            
            for (const loc of locations) {
                for (const alias of loc.aliases) {
                    const aliasLower = alias.toLowerCase();
                    if (aliasLower.includes(normalizedQuery)) {
                        return loc; // точное вхождение
                    }
                    const distance = levenshtein(normalizedQuery, aliasLower);
                    if (distance < bestScore && distance <= 3) { // порог в 3 ошибки
                        bestScore = distance;
                        bestMatch = loc;
                    }
                }
            }
            return bestMatch;
        }
        
        // --- ПРЕДУГАДЫВАНИЕ (автокомплит) ---
        function getAutocompleteSuggestions(input) {
            const value = input.toLowerCase().trim();
            if (!value) return [];
            const matches = [];
            for (const loc of locations) {
                for (const alias of loc.aliases) {
                    if (alias.toLowerCase().startsWith(value)) {
                        matches.push(alias);
                    }
                }
            }
            return [...new Set(matches)]; // уникальные
        }
        
        // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
        let map;
        let currentRouteLayer = null;
        let currentRouteSource = null;
        let lastTarget = "";
        let userLocation = null;
        let isRecording = false;
        let recognition = null;
        let aiRecognition = null;
        let searching = false;
        
        const targetInput = document.getElementById('target-input');
        const micBtn = document.getElementById('mic-btn');
        const goBtn = document.getElementById('go-btn');
        const btnMap = document.getElementById('btn-map');
        const btnAr = document.getElementById('btn-ar');
        const arScene = document.getElementById('arScene');
        const closeArBtn = document.getElementById('closeArBtn');
        const aiAssistant = document.getElementById('ai-assistant');
        
        // --- АВТОКОМПЛИТ ---
        let autocompleteDiv = null;
        function showAutocomplete() {
            if (autocompleteDiv) autocompleteDiv.remove();
            const suggestions = getAutocompleteSuggestions(targetInput.value);
            if (suggestions.length === 0) return;
            autocompleteDiv = document.createElement('div');
            autocompleteDiv.className = 'autocomplete-items';
            targetInput.parentNode.appendChild(autocompleteDiv);
            suggestions.forEach(s => {
                const div = document.createElement('div');
                div.textContent = s;
                div.onclick = () => {
                    targetInput.value = s;
                    autocompleteDiv.remove();
                    autocompleteDiv = null;
                };
                autocompleteDiv.appendChild(div);
            });
        }
        targetInput.addEventListener('input', showAutocomplete);
        document.addEventListener('click', (e) => {
            if (autocompleteDiv && !targetInput.contains(e.target) && !autocompleteDiv.contains(e.target)) {
                autocompleteDiv.remove();
                autocompleteDiv = null;
            }
        });
        
        // --- ПОСТРОЕНИЕ МАРШРУТА (через OSRM и геокодинг) ---
        async function geocodeAddress(address) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`;
            const resp = await fetch(url);
            const data = await resp.json();
            if (data.length === 0) throw new Error('Место не найдено');
            return { lon: parseFloat(data[0].lon), lat: parseFloat(data[0].lat), name: data[0].display_name };
        }
        
        async function buildRouteOSRM(start, end) {
            const url = `https://router.project-osrm.org/route/v1/driving/${start[0]},${start[1]};${end[0]},${end[1]}?overview=full&geometries=geojson`;
            const resp = await fetch(url);
            const data = await resp.json();
            if (data.code !== 'Ok') throw new Error('Маршрут не найден');
            return data.routes[0].geometry;
        }
        
        async function displayRoute(destinationText) {
            if (!userLocation) {
                alert('Не удалось определить ваше местоположение. Разрешите геолокацию.');
                return false;
            }
            goBtn.classList.add('searching');
            searching = true;
            try {
                // Сначала ищем в локальной базе
                const suggested = suggestLocation(destinationText);
                let searchQuery = destinationText;
                if (suggested) {
                    // можно взять первый алиас (русский) для геокодинга
                    const primaryAlias = suggested.aliases[0];
                    searchQuery = primaryAlias;
                }
                const dest = await geocodeAddress(searchQuery);
                const routeGeometry = await buildRouteOSRM(userLocation, [dest.lon, dest.lat]);
                
                if (currentRouteSource) {
                    if (map.getLayer(currentRouteLayer)) map.removeLayer(currentRouteLayer);
                    if (map.getSource(currentRouteSource)) map.removeSource(currentRouteSource);
                }
                map.addSource('route', {
                    type: 'geojson',
                    data: {
                        type: 'Feature',
                        properties: {},
                        geometry: routeGeometry
                    }
                });
                map.addLayer({
                    id: 'route',
                    type: 'line',
                    source: 'route',
                    layout: { 'line-join': 'round', 'line-cap': 'round' },
                    paint: { 'line-color': '#2e7d32', 'line-width': 5, 'line-opacity': 0.8 }
                });
                currentRouteLayer = 'route';
                currentRouteSource = 'route';
                
                new maplibregl.Marker({ color: '#ff5252' })
                    .setLngLat([dest.lon, dest.lat])
                    .setPopup(new maplibregl.Popup().setHTML(`<b>${dest.name}</b>`))
                    .addTo(map);
                
                const bounds = new maplibregl.LngLatBounds();
                bounds.extend(userLocation);
                bounds.extend([dest.lon, dest.lat]);
                map.fitBounds(bounds, { padding: 50 });
                return true;
            } catch (err) {
                alert('Ошибка: ' + err.message);
                return false;
            } finally {
                goBtn.classList.remove('searching');
                searching = false;
            }
        }
        
        // --- ПОИСК ПО КНОПКЕ "РАКЕТА" ---
        goBtn.onclick = async () => {
            if (searching) return;
            const query = targetInput.value.trim();
            if (!query) {
                alert('Введите или скажите место назначения.');
                return;
            }
            const suggested = suggestLocation(query);
            let finalQuery = query;
            if (suggested) {
                // если нашли похожее, спрашиваем, может пользователь имел в виду это?
                const primaryAlias = suggested.aliases[0];
                if (primaryAlias.toLowerCase() !== query.toLowerCase()) {
                    if (confirm(`Возможно, вы имели в виду "${primaryAlias}"? Нажмите ОК, чтобы построить маршрут туда.`)) {
                        finalQuery = primaryAlias;
                    }
                }
            }
            if (finalQuery === lastTarget) {
                alert(`Маршрут до "${finalQuery}" уже построен.`);
                return;
            }
            const success = await displayRoute(finalQuery);
            if (success) lastTarget = finalQuery;
        };
        
        // --- МИКРОФОН В ПОЛЕ ПОИСКА ---
        if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;
            recognition.onresult = (e) => {
                targetInput.value = e.results[0][0].transcript;
                stopMic();
            };
            recognition.onerror = () => stopMic();
            recognition.onend = () => stopMic();
            
            function startMic() {
                if (isRecording) return;
                try {
                    recognition.start();
                    micBtn.classList.add('recording');
                    isRecording = true;
                } catch(e) { alert('Ошибка запуска микрофона'); }
            }
            function stopMic() {
                if (!isRecording) return;
                try { recognition.stop(); } catch(e) {}
                micBtn.classList.remove('recording');
                isRecording = false;
            }
            micBtn.onclick = () => isRecording ? stopMic() : startMic();
        } else {
            micBtn.disabled = true;
            micBtn.style.opacity = '0.5';
        }
        
        // --- 3D/AR МОДЕЛЬ (открыть doomr.glb) ---
        btnAr.onclick = () => {
            arScene.style.display = 'block';
            // Запускаем AR-сцену
            const scene = document.querySelector('a-scene');
            if (scene && scene.hasLoaded === false) {
                scene.addEventListener('loaded', () => console.log('AR ready'));
            }
        };
        closeArBtn.onclick = () => {
            arScene.style.display = 'none';
        };
        
        // --- КНОПКА КАРТЫ (сброс вида) ---
        btnMap.onclick = () => {
            if (userLocation) map.flyTo({ center: userLocation, zoom: 14 });
            else map.flyTo({ center: [62.062, 53.747], zoom: 14 });
        };
        
        // --- ИНИЦИАЛИЗАЦИЯ КАРТЫ ---
        map = new maplibregl.Map({
            container: 'map',
            style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
            center: [62.062, 53.747],
            zoom: 14,
            pitch: 45
        });
        map.addControl(new maplibregl.NavigationControl(), 'top-right');
        map.addControl(new maplibregl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true },
            trackUserLocation: true,
            showUserHeading: true
        }), 'top-right');
        
        // Получение геопозиции
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                userLocation = [pos.coords.longitude, pos.coords.latitude];
                map.flyTo({ center: userLocation, zoom: 15 });
            }, err => console.warn('Геолокация недоступна:', err));
        }
        
        // Добавляем маркеры для всех точек на карте
        map.on('load', () => {
            locations.forEach(loc => {
                new maplibregl.Marker({ color: '#2e7d32' })
                    .setLngLat([loc.lng, loc.lat])
                    .setPopup(new maplibregl.Popup().setHTML(`<b>${loc.aliases[0]}</b><br>${loc.aliases[1]} / ${loc.aliases[2]}`))
                    .addTo(map);
            });
        });
        
        // --- ГОЛОСОВОЙ ПОМОЩНИК (ИИ) ---
        const synth = window.speechSynthesis;
        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.rate = 0.9;
            synth.speak(utterance);
        }
        
        async function handleAICommand(command) {
            const lower = command.toLowerCase();
            if (lower.includes('маршрут') || lower.includes('построй') || lower.includes('поехали')) {
                let place = command.replace(/построй|маршрут|до|поехали/gi, '').trim();
                if (place === '') place = targetInput.value.trim();
                if (place) {
                    targetInput.value = place;
                    const success = await displayRoute(place);
                    if (success) {
                        lastTarget = place;
                        speak(`Маршрут до ${place} построен.`);
                    } else speak(`Не удалось найти ${place}.`);
                } else speak('Скажите, куда построить маршрут.');
            } 
            else if (lower.includes('камера') || lower.includes('ar') || lower.includes('дополненная реальность')) {
                btnAr.click();
                speak('Открываю дополненную реальность.');
            }
            else if (lower.includes('проект') || lower.includes('что такое айдукс')) {
                speak('AIDUX — умная навигационная система с дополненной реальностью для Карабалыка.');
            }
            else if (lower.includes('контакты') || lower.includes('связь')) {
                speak('Перехожу на страницу контактов.');
                setTimeout(() => window.location.href = 'contact.html', 1000);
            }
            else if (lower.includes('привет')) {
                speak('Здравствуйте! Я голосовой помощник AIDUX. Чем могу помочь?');
            }
            else {
                speak('Я вас не понял. Попробуйте сказать: построй маршрут до акимата, открой камеру, или что такое AIDUX.');
            }
        }
        
        function startAIAssistant() {
            if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
                alert('Ваш браузер не поддерживает голосовой ввод.');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (aiRecognition) aiRecognition.abort();
            aiRecognition = new SpeechRecognition();
            aiRecognition.lang = 'ru-RU';
            aiRecognition.interimResults = false;
            aiRecognition.onstart = () => { speak('Слушаю'); };
            aiRecognition.onresult = async (e) => {
                const command = e.results[0][0].transcript;
                await handleAICommand(command);
            };
            aiRecognition.onerror = () => speak('Не удалось распознать команду.');
            aiRecognition.start();
        }
        aiAssistant.onclick = startAIAssistant;
        
        // --- ПОИСК ПО ENTER ---
        targetInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') goBtn.click();
        });
    </script>
</body>
</html>
