<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIDUX | Google Maps с AR</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AQ.Ab8RN6IKHHMLcwMNSBhfr2ROWAUasmNEyaUAJJLxeawFySi4Bg&libraries=places,directions&callback=initMap" async defer></script>
    <!-- A-Frame & AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; }
        .nav { position: fixed; top: 0; width: 100%; z-index: 4000; background: rgba(0,0,0,0.85); border-bottom: 1px solid #2e7d32; display: flex; justify-content: space-around; padding: 15px; }
        .nav a { color: white; text-decoration: none; font-weight: bold; }
        .nav a.active { color: #a5ffb1; }
        #map { height: 100%; width: 100%; position: absolute; top: 0; left: 0; z-index: 100; }
        #smart-panel {
            position: fixed; top: 75px; left: 50%; transform: translateX(-50%);
            z-index: 3000; width: 92%; max-width: 450px;
            padding: 15px; border-radius: 15px; background: rgba(0,0,0,0.8);
            border: 1px solid #2e7d32; backdrop-filter: blur(10px);
        }
        .search-row { display: flex; gap: 8px; margin-top: 10px; }
        input { flex: 1; height: 45px; background: #111; border: 1px solid #2e7d32; color: white; border-radius: 8px; padding: 0 10px; }
        .icon-btn { width: 45px; height: 45px; background: #2e7d32; border: none; border-radius: 8px; cursor: pointer; font-size: 20px; color: white; }
        .icon-btn:hover { transform: scale(1.05); }
        .recording { background: #ff5252 !important; }
        .ar-scene { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 7000; display: none; background: black; }
        .close-ar { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); color: white; border: none; font-size: 30px; cursor: pointer; width: 50px; height: 50px; border-radius: 50%; z-index: 7100; }
        #voiceBtn, #voiceText { z-index: 5000; }
    </style>
</head>
<body>
<header class="nav">
    <a href="index.html">Главная</a>
    <a href="about.html">О проекте</a>
    <a href="map.html" class="active">Карта</a>
    <a href="contact.html">Связь</a>
</header>

<div id="smart-panel">
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <button id="btn-my-location" class="icon-btn">📍</button>
        <button id="btn-ar" class="icon-btn">📷</button>
    </div>
    <div class="search-row">
        <input type="text" id="target-input" placeholder="Куда идем? (школа, мечеть, акимат)" autocomplete="off">
        <button id="mic-btn" class="icon-btn">🎤</button>
        <button id="go-btn" class="icon-btn">🚀</button>
    </div>
</div>

<div id="map"></div>

<div id="arScene" class="ar-scene">
    <button class="close-ar" id="closeArBtn">✖</button>
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-marker preset="hiro">
            <a-entity gltf-model="url(doomr.glb)" scale="0.05 0.05 0.05"></a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
</div>

<button id="voiceBtn">🎙️</button>
<div id="voiceText">AIDUX готов</div>

<script src="script.js"></script>
<script src="voice.js"></script>

<script>
    let map, directionsService, directionsRenderer, userMarker, userLocation = null;
    let currentRoute = null;
    let lastTarget = "";
    let isRecording = false;
    let recognition = null;
    let searching = false;
    let autocomplete;

    const targetInput = document.getElementById('target-input');
    const micBtn = document.getElementById('mic-btn');
    const goBtn = document.getElementById('go-btn');
    const btnMyLocation = document.getElementById('btn-my-location');
    const btnAr = document.getElementById('btn-ar');
    const arScene = document.getElementById('arScene');
    const closeArBtn = document.getElementById('closeArBtn');

    // Локальные места (Костанай)
    const locations = [
        { lat: 53.747230, lng: 62.063310, name: "Акимат", aliases: ["акимат", "akimat", "әкімат"] },
        { lat: 53.746552, lng: 62.061851, name: "ДЮСШ", aliases: ["дюсш", "dyussh"] },
        { lat: 53.746725, lng: 62.062435, name: "Дом культуры", aliases: ["дом культуры", "house of culture"] },
        { lat: 53.749788, lng: 62.053697, name: "Мечеть", aliases: ["мечеть", "mosque", "мешіт"] },
        { lat: 53.748111, lng: 62.053639, name: "Школа №1", aliases: ["школа №1", "школа 1", "school 1"] },
        { lat: 53.749254, lng: 62.070684, name: "Школа №2", aliases: ["школа №2", "школа 2", "school 2"] }
    ];

    // Инициализация карты
    function initMap() {
        const center = { lat: 53.747, lng: 62.063 };
        map = new google.maps.Map(document.getElementById('map'), {
            center: center,
            zoom: 14,
            styles: [{ featureType: "poi", elementType: "labels", stylers: [{ visibility: "off" }] }] // опционально
        });
        directionsService = new google.maps.DirectionsService();
        directionsRenderer = new google.maps.DirectionsRenderer({ map: map, suppressMarkers: false });
        directionsRenderer.setMap(map);

        // Добавляем маркеры локальных мест
        locations.forEach(loc => {
            new google.maps.Marker({
                position: { lat: loc.lat, lng: loc.lng },
                map: map,
                title: loc.name,
                icon: { url: "http://maps.google.com/mapfiles/ms/icons/green-dot.png" }
            });
        });

        // Геолокация пользователя
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                if (userMarker) userMarker.setMap(null);
                userMarker = new google.maps.Marker({
                    position: userLocation,
                    map: map,
                    title: "Вы здесь",
                    icon: { url: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png" }
                });
                map.setCenter(userLocation);
            }, err => console.warn("Геолокация недоступна"));
        }

        // Автокомплит (Google Places)
        autocomplete = new google.maps.places.Autocomplete(targetInput);
        autocomplete.bindTo('bounds', map);
    }

    // Построение маршрута через Google Directions
    async function displayRoute(destinationText) {
        if (!userLocation) {
            if (window.AIDUX?.speak) window.AIDUX.speak("Не удалось определить ваше местоположение");
            return false;
        }
        goBtn.classList.add('searching');
        searching = true;
        try {
            // Сначала ищем среди локальных мест
            let destination = null;
            const lowerQuery = destinationText.toLowerCase();
            for (let loc of locations) {
                if (loc.aliases.some(alias => alias.toLowerCase() === lowerQuery || alias.toLowerCase().includes(lowerQuery))) {
                    destination = { lat: loc.lat, lng: loc.lng, name: loc.name };
                    break;
                }
            }
            // Если не нашли локально, используем Places API
            if (!destination) {
                const geocoder = new google.maps.Geocoder();
                const result = await new Promise((resolve) => {
                    geocoder.geocode({ address: destinationText + ", Костанай" }, (results, status) => {
                        if (status === "OK" && results[0]) resolve(results[0].geometry.location);
                        else resolve(null);
                    });
                });
                if (!result) throw new Error("Место не найдено");
                destination = { lat: result.lat(), lng: result.lng(), name: destinationText };
            }

            const request = {
                origin: userLocation,
                destination: destination,
                travelMode: google.maps.TravelMode.DRIVING
            };
            directionsService.route(request, (result, status) => {
                if (status === "OK") {
                    directionsRenderer.setDirections(result);
                    map.fitBounds(result.routes[0].bounds);
                    if (window.AIDUX?.speak) window.AIDUX.speak(`Маршрут до ${destination.name} построен`);
                } else {
                    throw new Error("Маршрут не найден");
                }
            });
            return true;
        } catch (err) {
            if (window.AIDUX?.speak) window.AIDUX.speak(`Ошибка: ${err.message}`);
            return false;
        } finally {
            goBtn.classList.remove('searching');
            searching = false;
        }
    }

    // Микрофон для поля поиска
    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SR();
        recognition.lang = 'ru-RU';
        recognition.interimResults = false;
        recognition.onresult = (e) => {
            targetInput.value = e.results[0][0].transcript;
            stopMic();
        };
        recognition.onerror = () => stopMic();
        function startMic() {
            if (isRecording) return;
            recognition.start();
            micBtn.classList.add('recording');
            isRecording = true;
        }
        function stopMic() {
            if (!isRecording) return;
            recognition.stop();
            micBtn.classList.remove('recording');
            isRecording = false;
        }
        micBtn.onclick = () => isRecording ? stopMic() : startMic();
    } else {
        micBtn.disabled = true;
    }

    // Кнопки
    btnMyLocation.onclick = () => {
        if (userLocation) map.setCenter(userLocation);
        else if (window.AIDUX?.speak) window.AIDUX.speak("Местоположение не определено");
    };
    btnAr.onclick = () => { arScene.style.display = 'block'; if(window.AIDUX?.speak) window.AIDUX.speak("Открываю AR"); };
    closeArBtn.onclick = () => { arScene.style.display = 'none'; };
    goBtn.onclick = async () => {
        if (searching) return;
        const query = targetInput.value.trim();
        if (!query) {
            if(window.AIDUX?.speak) window.AIDUX.speak("Введите или скажите место");
            return;
        }
        if (query === lastTarget) {
            if(window.AIDUX?.speak) window.AIDUX.speak(`Маршрут до ${query} уже построен`);
            return;
        }
        const success = await displayRoute(query);
        if (success) lastTarget = query;
    };
    targetInput.addEventListener('keypress', e => { if (e.key === 'Enter') goBtn.click(); });

    // Глобальный initMap для callback Google API
    window.initMap = initMap;

    // Кастомный обработчик для голосового помощника
    setTimeout(() => {
        if (window.initVoice) {
            window.initVoice((cmd, raw) => {
                const l = cmd.toLowerCase();
                if (l.includes('маршрут') || l.includes('построй') || l.includes('поехали')) {
                    let place = raw.replace(/построй|маршрут|до|поехали/gi, '').trim();
                    if (!place) place = targetInput.value.trim();
                    if (place) {
                        targetInput.value = place;
                        displayRoute(place);
                    } else window.AIDUX.speak("Скажите, куда построить маршрут");
                    return true;
                }
                if (l.includes('камера') || l.includes('ar')) { btnAr.click(); return true; }
                if (l.includes('где я')) {
                    if (userLocation) window.AIDUX.speak(`Вы в точке ${userLocation.lat.toFixed(4)}, ${userLocation.lng.toFixed(4)}`);
                    else window.AIDUX.speak("Местоположение не определено");
                    return true;
                }
                if (l.includes('что такое aidux')) { window.AIDUX.speak("AIDUX — умная навигация с AR для Костаная."); return true; }
                if (l.includes('контакты')) { window.AIDUX.speak("Перехожу на страницу контактов"); setTimeout(() => location.href = "contact.html", 1000); return true; }
                if (l.includes('привет')) { window.AIDUX.speak("Здравствуйте! Я AIDUX. Скажите 'построй маршрут до мечети'."); return true; }
                return false;
            });
        }
    }, 300);
</script>
</body>
</html>
