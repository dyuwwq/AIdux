<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты | AIDUX</title>
    <link rel="stylesheet" href="style.css">
    <style>
        input, textarea {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: white;
            outline: none;
            box-sizing: border-box; /* Чтобы padding не раздувал ширину */
        }
        input::placeholder, textarea::placeholder {
            color: rgba(255,255,255,0.5);
        }
        input:focus, textarea:focus {
            border-color: #2e7d32;
        }
        /* Убедитесь, что .hidden обрабатывается в script.js или удалите его */
    </style>
</head>
<body>

<header class="nav glass">
    <a href="index.html" class="logo">AIDUX</a>
    <nav class="nav-links">
        <a href="index.html">Главная</a>
        <a href="about.html">О проекте</a>
        <a href="map.html">Карта</a>
        <a href="contact.html" class="active">Связь</a>
    </nav>
</header>

<main class="container">
    <section class="glass" style="max-width: 600px; margin: 40px auto; padding: 40px;">
        <h2 style="text-align: center; margin-bottom: 25px;">Связаться с нами</h2>

        <form id="form">
            <input type="text" name="name" placeholder="Ваше имя" required>
            <input type="email" name="email" placeholder="Ваш Email" required>
            <textarea name="message" placeholder="Ваше сообщение..." rows="5" required></textarea>
            <button type="submit" class="btn" style="width: 100%; cursor: pointer;">Отправить</button>
        </form>

        <div id="msg" style="display:none; text-align: center; margin-top: 20px; color: #a5ffb1;">
            Сообщение отправлено ✅
        </div>
    </section>
</main>

<footer style="text-align: center; padding: 50px; opacity: 0.5;">
    © 2026 AIDUX Digital Project | Костанай
</footer>

<button id="voiceBtn">🎤</button>
<div id="voiceText">AIDUX готов</div>

<script src="script.js"></script>
<script src="voice.js"></script>

<script>
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");

    if (form) {
        form.addEventListener("submit", e => {
            e.preventDefault();
            
            // Здесь обычно идет fetch-запрос к серверу
            
            msg.style.display = "block";
            form.reset();

            // Скрываем уведомление через 3 секунды
            setTimeout(() => {
                msg.style.display = "none";
            }, 3000);
        });
    }
</script>
</body>
</html>
